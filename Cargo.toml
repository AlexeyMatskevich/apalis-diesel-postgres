[package]
name = "apalis-diesel-postgres"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL storage backend for Apalis implemented with Diesel."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexeyMatskevich/apalis-diesel-postgres"
documentation = "https://docs.rs/apalis-diesel-postgres"
readme = "README.md"
keywords = ["apalis", "diesel", "postgres", "jobs", "queue"]
categories = ["asynchronous", "database"]
authors = ["Aleksey Matskevich"]
exclude = [
    ".env.example",
    ".github/",
    ".gitignore",
    ".zed/",
    ".venv/",
    "flake.lock",
    "flake.nix",
    "scripts/",
]

# Build docs.rs with every feature so the `ntex` runtime path is documented
# alongside the default `tokio` one; `--cfg docsrs` lets any future
# `#[cfg_attr(docsrs, doc(cfg(...)))]` feature badges render.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The apalis RC crates are pinned exactly: cargo treats prerelease versions
# as caret-compatible within the same x.y.z, so an unpinned `1.0.0-rc.9`
# would let a plain `cargo update` pull in `rc.10` — which may break public
# trait shapes this crate implements (`Backend`, `Acknowledge`, …) without
# any semver signal. Bump the pins deliberately, together with a release.
apalis-codec = { version = "=0.1.0-rc.9", features = ["json"] }
apalis-core = { version = "=1.0.0-rc.9", default-features = false, features = ["sleep"] }
apalis-sql = { version = "=1.0.0-rc.9" }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "chrono", "serde_json"] }
diesel_migrations = "2.3"
futures = "0.3"
ntex-rt = { version = "3.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Production code only ever calls `tokio::task::spawn_blocking` (src/runtime.rs);
# the macros/multi-thread/time features tests and examples need live in
# [dev-dependencies] below.
tokio = { version = "1", features = ["rt"], optional = true }
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
apalis = "=1.0.0-rc.9"
lets_expect = { version = "0.5", features = ["tokio"] }
ntex = { version = "3", default-features = false, features = ["neon-polling"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
ntex = ["dep:ntex-rt"]

[[example]]
name = "outbox"
required-features = ["tokio"]

[[example]]
name = "worker"
required-features = ["tokio"]

[[example]]
name = "worker-ntex"
required-features = ["ntex"]
